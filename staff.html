<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>藍星科技 11月實戰班｜工作人員快速簽到</title>
  <meta name="description" content="藍星科技超級自媒體 × AI變現實戰班 11月場次工作人員快速簽到頁。">
  <link rel="stylesheet" href="./styles.css?v=20260826234000">
</head>
<body>
  <main class="app staff-app">
    <section class="hero staff-hero">
      <h1>工作人員快速簽到</h1>
      <p>第一次成功輸入 PIN 後，這台裝置會自動記住，之後選場次、搜尋姓名後可直接報到。</p>
      <a class="sheet-link" href="./index.html">回一般簽到頁</a>
    </section>

    <section class="panel staff-toolbar">
      <label>場次
        <select id="staffSession">
          <option value="11/16 台南場">11/16（一）台南場</option>
          <option value="11/17 高雄場">11/17（二）高雄場</option>
          <option value="11/19 台北場">11/19（四）台北場</option>
          <option value="11/21 台中場">11/21（六）台中場</option>
        </select>
      </label>
      <label>PIN
        <input id="staffPin" type="password" inputmode="numeric" maxlength="4" placeholder="第一次請輸入 PIN">
      </label>
      <label>搜尋姓名
        <input id="staffSearch" autocomplete="off" placeholder="輸入姓名關鍵字">
      </label>
      <button id="staffRefresh" type="button">重新整理</button>
    </section>

    <section class="stats staff-stats" id="staffStats"></section>
    <p class="message" id="staffMessage" aria-live="polite"></p>
    <section class="panel staff-list" id="staffList"></section>
  </main>

  <script src="./staff.js?v=20261020203000"></script>
</body>
</html>
