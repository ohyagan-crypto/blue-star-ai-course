<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>藍星周三剪映實戰班｜工作人員名單頁</title>
  <meta name="description" content="藍星周三剪映實戰班工作人員名單查看頁。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app staff-app">
    <section class="hero staff-hero">
      <div>
        <h1>工作人員名單頁</h1>

      </div>
      <a class="sheet-link" href="./index.html">回報名頁</a>
    </section>

    <section class="panel staff-toolbar no-pin">
      <label>場次
        <select id="staffSession">
          <option value="6/24 剪映實戰班">6/24 剪映實戰班</option>
          <option value="7/1 剪映實戰班">7/1 剪映實戰班</option>
        </select>
      </label>
      <label>搜尋姓名
        <input id="staffSearch" autocomplete="off" placeholder="輸入姓名關鍵字">
      </label>
      <button id="staffRefresh" type="button">重新整理</button>
    </section>

    <section class="stats staff-stats" id="staffStats"></section>
    <p class="message" id="staffMessage" aria-live="polite"></p>
    <section class="panel staff-list" id="staffList"></section>
  </main>

  <script src="./staff.js?v=20260618110500"></script>

</html>
